name: ILSpy 反编译热更dll
on:
  push:
    paths:
      - 'hotdll/**'
      - '.github/workflows/ilspy.yml'
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: 安装 ilspycmd
        run: |
          dotnet tool install -g ilspycmd
          echo "/home/runner/.dotnet/tools" >> $GITHUB_PATH
      - name: 反编译
        run: |
          set -e
          mkdir -p /tmp/out
          echo "=== ilspy version ==="
          ilspycmd --version || true
          echo "=== decompile Hotfix ==="
          ilspycmd hotdll/Hotfix.dll -o /tmp/out/Hotfix.cs 2>&1 | tail -20 || echo HOTFIX_FAIL
          echo "=== decompile Model ==="
          ilspycmd hotdll/Model.dll -o /tmp/out/Model.cs 2>&1 | tail -20 || echo MODEL_FAIL
          echo "=== files ==="
          ls -la /tmp/out/
          find /tmp/out -name "*.cs" -exec du -h {} \;
      - name: 回推产物
        run: |
          mkdir -p decomp
          cp /tmp/out/Hotfix.cs decomp/ 2>/dev/null || true
          cp /tmp/out/Model.cs decomp/ 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add decomp/
          git commit -m "decomp out [skip ci]" || echo "nothing to commit"
          git push
