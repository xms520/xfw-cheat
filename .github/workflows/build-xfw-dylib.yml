name: build-xfw-dylib
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XXCFloat.dylib (arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -arch arm64 -dynamiclib -fobjc-arc -fobjc-weak \
            -mios-version-min=15.0 -isysroot "$SDK" \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore -framework JavaScriptCore -framework UniformTypeIdentifiers -lcompression -lsqlite3 \
            -o XXCFloat.dylib XXCFloat.m
          ls -la XXCFloat.dylib
          otool -L XXCFloat.dylib | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: XXCFloat.dylib
          path: XXCFloat.dylib
